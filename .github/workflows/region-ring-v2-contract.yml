name: Region Ring V2 contract

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/region-ring-v2-*'
    paths:
      - '.github/workflows/region-ring-v2-contract.yml'
      - 'src/llama-region-ring-v2.h'
      - 'ggml/src/ggml-rpc/phone-qwen3-local-builder.h'
      - 'ggml/src/ggml-rpc/phone-plan-region-map.h'
      - 'tests/test-region-ring-v2-stage.cpp'
      - 'tests/test-phone-qwen3-local-builder.cpp'
      - 'tests/test-phone-plan-region-map.cpp'
      - 'tests/CMakeLists.txt'
      - 'tools/region-ring-experiments/**'
      - 'ggml/include/ggml-rpc.h'
      - 'ggml/src/ggml-rpc/ggml-rpc.cpp'
      - 'tools/CMakeLists.txt'

jobs:
  host-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile standalone V2 Stage contract in Release mode
        run: |
          g++ -std=c++17 -DNDEBUG -O2 -Wall -Wextra -Werror \
            tests/test-region-ring-v2-stage.cpp -o /tmp/test-region-ring-v2-stage
          /tmp/test-region-ring-v2-stage
      - name: Build GGML Phone metadata tests and native prefix profiler
        run: |
          cmake -S . -B build -DGGML_RPC=ON -DLLAMA_BUILD_TESTS=ON \
            -DGGML_NATIVE=OFF
          cmake --build build --config Release --parallel 4 \
            --target test-phone-qwen3-local-builder test-phone-plan-region-map \
                     test-phone-mixed-pipeline test-region-ring-v2-stage \
                     region-ring-v2-stage-profile ggml-rpc-server
          ctest --test-dir build --output-on-failure \
            -R "^(test-phone-qwen3-local-builder|test-phone-plan-region-map|test-phone-mixed-pipeline|test-region-ring-v2-stage|test-region-ring-v2-profile-help)$"
      - name: Test native CPU N1-N4 prefix, resumable matrix and Phone RPC
        run: |
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --user numpy ./gguf-py
          ctest --test-dir build --output-on-failure \
            -R "^(test-region-ring-v2-native-cpu-prefix|test-region-ring-v2-matrix-cache|test-region-ring-v2-phone-profile-wire|test-region-ring-v2-runtime-profile-import)$"
