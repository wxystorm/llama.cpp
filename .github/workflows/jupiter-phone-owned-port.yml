name: Jupiter Phone-owned Native Graph Port

on:
  push:
    branches:
      - feat/jupiter-phone-owned-graphless-20261122
      - feat/jupiter-phone-owned-multishape-20261123
      - feat/jupiter-phone-owned-main-align-20261123
      - feat/jupiter-phone-autonomous-prefill-20261123
  workflow_dispatch:

jobs:
  model-free-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure RPC CPU-only build (no phone required)
        run: >-
          cmake -S . -B build-phone-owned
          -DGGML_CUDA=OFF
          -DGGML_RPC=ON
          -DLLAMA_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Compile RPC server and Phone-owned tests
        run: >-
          cmake --build build-phone-owned --parallel 4
          --target
          test-phone-owned-execution-plan
          test-phone-qwen3-local-builder
          test-phone-qwen3-local-parity
          test-phone-owned-autonomous-queue
          test-jupiter-phone-owned-rpc
          ggml-rpc-server
          llama-cli
          llama-tokenize
      - name: Validate full-Prefill runner syntax
        run: >-
          python -m py_compile
          tools/jupiter/run_phone_owned_full_prefill.py
          tools/jupiter/compare_phone_owned_stages.py
          tools/jupiter/test_phone_owned_residency.py
          tools/jupiter/run_phone_owned_multi_prompt.py
          tools/jupiter/run_phone_owned_async_ab.py
          tools/jupiter/inspect_phone_owned_overlap.py
          tools/jupiter/run_phone_owned_autonomous_ab.py
          tools/jupiter/run_phone_owned_full_suite.py
          tools/jupiter/test_run_phone_owned_full_suite.py
          tools/jupiter/run_min_chunk_profile.py
          tools/jupiter/run_sequence_pipeline.py
      - name: Run full-suite planner/resume unit tests
        run: python -m unittest discover -s tools/jupiter -p test_run_phone_owned_full_suite.py -v
      - name: Run model-free contract tests
        run: >-
          ctest --test-dir build-phone-owned --output-on-failure
          -R 'test-phone-owned-execution-plan|test-phone-qwen3-local-builder|test-phone-qwen3-local-parity|test-phone-owned-autonomous-queue'
