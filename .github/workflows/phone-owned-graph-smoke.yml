name: Phone-owned Qwen3 graph smoke

on:
  push:
    branches:
      - feat/phone-owned-plan-bootstrap-20261106
      - feat/phone-npu-dual-bank-offline-plan-20261107
      - feat/phone-npu-adreno-no-mid-p2c-host-move-20261107
  workflow_dispatch:

jobs:
  linux-graph-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-phone-owned -DGGML_RPC=ON -DLLAMA_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
      - name: Compile local graph, RPC and context
        run: cmake --build build-phone-owned --target llama-cli test-phone-owned-execution-plan test-phone-qwen3-local-builder test-phone-qwen3-local-parity test-phone-npu-weight-banks test-region-ring-planner test-region-ring test-phone-plan-region-map region-ring-offline-plan --parallel 4
      - name: Test local graph and plan
        run: ctest --test-dir build-phone-owned -R 'test-phone-(owned-execution-plan|qwen3-local-builder|qwen3-local-parity|npu-weight-banks|plan-region-map)|test-region-ring(-planner)?' --output-on-failure
      - name: Test four-backend Python DAG and saved-plan schema
        run: python3 -m unittest discover -s tools/region-ring-experiments -p 'test_mixed_phone*.py' -v
